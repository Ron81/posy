# Runs the reference implementation against the test vectors on every push and pull request.
#
# NOTE: GitHub only executes workflows from .github/workflows/. The original repo plan lists
# "examples/loopback-demo/ci.yml" — that location would silently never run, so it lives here.
#
# Prerequisites (created in Phase 2): reference/js/package.json with "build" and "test" scripts,
# and a committed reference/js/package-lock.json (needed by `npm ci`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: reference/js/package-lock.json

      - name: Generated spec tables are up to date
        run: node scripts/generate-spec-tables.mjs --check

      - name: Install reference implementation
        working-directory: reference/js
        run: npm ci

      - name: Build (type-check)
        working-directory: reference/js
        run: npm run build

      - name: Reference implementation vs. test vectors
        working-directory: reference/js
        run: npm test
